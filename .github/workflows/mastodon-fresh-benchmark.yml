name: "Mastodon Docker Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional exact BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for isolated comparison runs."
        required: false
        type: string
        default: ""
      upstream_ref:
        description: "Optional Mastodon ref or SHA instead of the pinned submodule commit."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 4 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GHA / Server
            strategy: actions-cache
            workload: server
            benchmark_id: mastodon
            docker_tool_cache: false
          - name: BC / Server
            strategy: boringcache
            workload: server
            benchmark_id: mastodon
            docker_tool_cache: false
          - name: BC + sccache / Server
            strategy: boringcache
            workload: server
            benchmark_id: mastodon-sccache
            docker_tool_cache: true
          - name: GHA / Streaming
            strategy: actions-cache
            workload: streaming
            benchmark_id: mastodon-streaming
            docker_tool_cache: false
          - name: BC / Streaming
            strategy: boringcache
            workload: streaming
            benchmark_id: mastodon-streaming
            docker_tool_cache: false
    uses: ./.github/workflows/reusable-mastodon-docker-benchmark.yml
    with:
      strategy: ${{ matrix.strategy }}
      workload: ${{ matrix.workload }}
      cache_lane: fresh
      benchmark_id: ${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix) }}
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ inputs.buildkit_image }}
      docker_tool_cache: ${{ matrix.docker_tool_cache }}
      upstream_ref: ${{ inputs.upstream_ref }}
    secrets: inherit
