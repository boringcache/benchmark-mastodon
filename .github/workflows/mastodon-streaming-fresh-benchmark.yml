name: "Mastodon Streaming Docker Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image for canary runs."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional BoringCache CLI release tag for canary runs, for example vcli-canary."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix appended to built-in benchmark/cache scopes for isolated comparison runs."
        required: false
        type: string
        default: ""
      lane_filter:
        description: "Optional manual-dispatch lane filter."
        required: false
        type: choice
        default: all
        options:
          - all
          - boringcache
  schedule:
    - cron: "15 4 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  github-actions-cache:
    name: GHA
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.lane_filter != 'boringcache') }}
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: actions-cache
      cache_lane: fresh
      benchmark_id: ${{ format('mastodon-streaming{0}', inputs.benchmark_id_suffix) }}
      project_repo: mastodon/mastodon
      dockerfile_path: upstream/streaming/Dockerfile
      docker_context: upstream
      image_tag: mastodon-streaming-benchmark:latest
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit

  boringcache:
    name: BoringCache
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.lane_filter == 'all' || inputs.lane_filter == 'boringcache') }}
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: fresh
      benchmark_id: ${{ format('mastodon-streaming{0}', inputs.benchmark_id_suffix) }}
      project_repo: mastodon/mastodon
      dockerfile_path: upstream/streaming/Dockerfile
      docker_context: upstream
      image_tag: mastodon-streaming-benchmark:latest
      cli_platform: linux-amd64
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ inputs.buildkit_image || 'ghcr.io/boringcache/buildkit:v0.30.0-bc' }}
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit
