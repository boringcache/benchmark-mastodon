name: "Mastodon Docker Benchmark"
run-name: ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Rolling', github.event_name == 'push' && 'Upstream update' || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
    inputs:
      buildkit_image: {description: "Optional managed BoringCache BuildKit image.", required: false, type: string, default: ""}
      cli_version: {description: "Optional exact BoringCache CLI release tag.", required: false, type: string, default: ""}
      benchmark_id_suffix: {description: "Optional suffix for isolated comparison runs.", required: false, type: string, default: ""}
      upstream_ref: {description: "Optional Mastodon ref or SHA instead of the pinned submodule commit.", required: false, type: string, default: ""}
      runner_label: {description: "Optional runner label for a manual main-branch experiment.", required: false, type: string, default: ""}
  push:
    branches: [main]
    paths: [".gitmodules", "upstream"]
concurrency: {group: "${{ github.workflow }}-${{ github.ref_name }}", cancel-in-progress: false}
permissions: {contents: read, actions: write, packages: write}
env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  BORINGCACHE_NO_GIT: "true"
jobs:
  commit:
    name: ${{ matrix.provider }} ${{ matrix.case }} commit
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {provider: GitHub Actions, case: Mastodon server, strategy: actions-cache, workload: server, benchmark_id: mastodon, compiler_cache: ""}
          - {provider: BoringCache, case: Mastodon server, strategy: boringcache, workload: server, benchmark_id: mastodon, compiler_cache: ""}
          - {provider: BoringCache, case: Mastodon server ccache, strategy: boringcache, workload: server, benchmark_id: mastodon-ccache, compiler_cache: ccache}
          - {provider: BoringCache, case: Mastodon server sccache, strategy: boringcache, workload: server, benchmark_id: mastodon-sccache, compiler_cache: sccache}
          - {provider: GitHub Actions, case: Mastodon streaming, strategy: actions-cache, workload: streaming, benchmark_id: mastodon-streaming, compiler_cache: ""}
          - {provider: BoringCache, case: Mastodon streaming, strategy: boringcache, workload: streaming, benchmark_id: mastodon-streaming, compiler_cache: ""}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/mastodon-docker-benchmark
        with: {strategy: "${{ matrix.strategy }}", workload: "${{ matrix.workload }}", cache_lane: rolling, phase: publish, benchmark_id: "${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix) }}", cli_version: "${{ inputs.cli_version }}", buildkit_image: "${{ inputs.buildkit_image }}", compiler_cache: "${{ matrix.compiler_cache }}", upstream_ref: "${{ inputs.upstream_ref }}", push_image: "true"}
  report:
    name: Mastodon Docker rolling report
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download the benchmark phase evidence
        uses: actions/download-artifact@v6
        with:
          pattern: phase-*
          path: phase-evidence
      - name: Publish the Mastodon Docker benchmark report
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "Mastodon Docker rolling benchmark" \
            --input-dir phase-evidence \
            --output-dir benchmark-results
      - name: Retain the mastodon BoringCache rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-mastodon${{ inputs.benchmark_id_suffix }}-boringcache-rolling
          path: benchmark-results/mastodon${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
          if-no-files-found: error
      - name: Retain the mastodon GitHub Actions rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-mastodon${{ inputs.benchmark_id_suffix }}-actions-cache-rolling
          path: benchmark-results/mastodon${{ inputs.benchmark_id_suffix }}-actions-cache-rolling.json
          if-no-files-found: error
      - name: Retain the mastodon-sccache BoringCache rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-mastodon-sccache${{ inputs.benchmark_id_suffix }}-boringcache-rolling
          path: benchmark-results/mastodon-sccache${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
          if-no-files-found: error
      - name: Retain the mastodon-ccache BoringCache rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-mastodon-ccache${{ inputs.benchmark_id_suffix }}-boringcache-rolling
          path: benchmark-results/mastodon-ccache${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
          if-no-files-found: error
      - name: Retain the mastodon-streaming BoringCache rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-mastodon-streaming${{ inputs.benchmark_id_suffix }}-boringcache-rolling
          path: benchmark-results/mastodon-streaming${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
          if-no-files-found: error
      - name: Retain the mastodon-streaming GitHub Actions rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-mastodon-streaming${{ inputs.benchmark_id_suffix }}-actions-cache-rolling
          path: benchmark-results/mastodon-streaming${{ inputs.benchmark_id_suffix }}-actions-cache-rolling.json
          if-no-files-found: error
