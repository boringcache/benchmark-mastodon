name: "Rolling Benchmark Dispatch"

on:
  workflow_dispatch:
    inputs:
      run_docker:
        description: "Dispatch the Docker rolling benchmark pair"
        required: false
        type: boolean
        default: true
      run_streaming_docker:
        description: "Dispatch the Streaming Docker rolling benchmark"
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch-docker:
    name: Dispatch Docker rolling benchmark
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Docker rolling benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run "mastodon-docker-benchmark.yml" --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"

  dispatch-streaming-docker:
    name: Dispatch Streaming Docker rolling benchmark
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_streaming_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Streaming Docker rolling benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run "mastodon-streaming-docker-benchmark.yml" --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
