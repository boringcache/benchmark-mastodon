name: "Rolling Benchmark Dispatch"

on:
  workflow_dispatch:
    inputs:
      run_docker:
        description: "Dispatch the Docker rolling benchmark pair"
        required: false
        type: boolean
        default: true
      run_streaming_docker:
        description: "Dispatch the Streaming Docker rolling benchmark pair"
        required: false
        type: boolean
        default: true
      blob_download_concurrency:
        description: "Optional BORINGCACHE_BLOB_DOWNLOAD_CONCURRENCY override for the BoringCache run"
        required: false
        type: string
      blob_prefetch_concurrency:
        description: "Optional BORINGCACHE_BLOB_PREFETCH_CONCURRENCY override for the BoringCache run"
        required: false
        type: string
      oci_stream_through_min_bytes:
        description: "Optional BORINGCACHE_OCI_STREAM_THROUGH_MIN_BYTES for Docker/OCI BoringCache runs"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch-docker:
    name: Dispatch Docker rolling benchmark
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Docker rolling benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run "mastodon-docker-benchmark.yml" --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
          -f blob_download_concurrency="${{ inputs.blob_download_concurrency || '' }}"
          -f blob_prefetch_concurrency="${{ inputs.blob_prefetch_concurrency || '' }}"
          -f oci_stream_through_min_bytes="${{ inputs.oci_stream_through_min_bytes || '' }}"

  dispatch-streaming-docker:
    name: Dispatch Streaming Docker rolling benchmark pair
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_streaming_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch GitHub Actions Cache streaming rolling lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "mastodon-streaming-docker-actions-cache.yml" --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" -f cache_lane=rolling

      - name: Dispatch BoringCache streaming rolling lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run "mastodon-streaming-docker-boringcache.yml" --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
          -f cache_lane=rolling
          -f blob_download_concurrency="${{ inputs.blob_download_concurrency || '' }}"
          -f blob_prefetch_concurrency="${{ inputs.blob_prefetch_concurrency || '' }}"
          -f oci_stream_through_min_bytes="${{ inputs.oci_stream_through_min_bytes || '' }}"
