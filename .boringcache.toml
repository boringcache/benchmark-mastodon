workspace = "boringcache/benchmark-mastodon"

[adapters.docker]
tag = "mastodon-docker-local"
metadata-hints = ["benchmark=mastodon", "upstream-job=build-image-amd64"]
command = [
  "docker", "buildx", "build",
  "--file", "__DOCKERFILE__",
  "--platform", "linux/amd64",
  "--build-arg", "MASTODON_VERSION_PRERELEASE=__PRERELEASE__",
  "--build-arg", "MASTODON_VERSION_METADATA=",
  "--build-arg", "SOURCE_COMMIT=__SOURCE_SHA__",
  "--tag", "__IMAGE__",
  "upstream",
]

[adapters.sccache]
tag = "mastodon-sccache-local"
metadata-hints = ["benchmark=mastodon-sccache", "upstream-job=build-image-amd64"]
